<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>教师资源预约</title>
		<link rel="stylesheet" href="../layui/css/layui.css" />
		<link rel='stylesheet' href='../fullcalendar/packages/core/main.css'  />
		<link rel='stylesheet' href='../fullcalendar/packages/daygrid/main.css'  />
		<link rel='stylesheet' href='../fullcalendar/packages/timegrid/main.css'  />
		
		<link rel="stylesheet" href="../css/mb.css">
		<link rel="stylesheet" href="../css/iframe.css" />
		<script type="text/javascript" src="../js/global.js"></script>
		<!-- <style type="text/css">
			body{
				font-family: Arial, Helvetica Neue, Helvetica, sans-serif;
				font-size: 14px;
			}
		</style> -->
		<style type="text/css">
			#calendar-box{
				width: 98%;
				height: 95%;
				margin: 1% auto;
			}
			#my-calendar{
				max-width: 100%;
				margin: 0 auto;
			}
		</style>
	</head>
	<body>
		
		<div id="calendar-box">
			<div id="my-calendar"></div>
		</div>
	
		
		<script src='../fullcalendar/packages/core/main.js'></script>
		<script src='../fullcalendar/packages/core/locales/zh-cn.js'></script>
		<script src='../fullcalendar/packages/interaction/main.js'></script>
		<script src='../fullcalendar/packages/daygrid/main.js'></script>
		<script src='../fullcalendar/packages/timegrid/main.js'></script>
		<script type="text/html" id="eventBox">
	<form class="layui-form" lay-filter="eventform">
	  <div class="layui-form-item">
	    <label class="layui-form-label">事件</label>
	    <div class="layui-input-block">
	      <input type="text" id="event" name="event" placeholder="要添加的事件" autocomplete="off" class="layui-input">
	    </div>
	  </div>
	  <div class="layui-form-item">
	    <label class="layui-form-label">开始日期</label>
	    <div class="layui-input-block">
	      <input type="text" id="startTime" name="startTime" placeholder="开始日期" autocomplete="off" class="layui-input">
	    </div>
	  </div>
	  <div class="layui-form-item">
	    <label class="layui-form-label">截至日期</label>
	    <div class="layui-input-block">
	      <input type="text" id="endTime" name="endTime" placeholder="请输入截至日期" autocomplete="off" class="layui-input">
	    </div>
	  </div>
	</form>
		</script>
		<script type="text/html" id="eventBox2">
	<form class="layui-form" lay-filter="eventform2">
	  <div class="layui-form-item">
	    <label class="layui-form-label">学院</label>
	    <div class="layui-input-block">
	      <input type="text" id="college" name="college" placeholder="所属学院" autocomplete="off" class="layui-input">
	    </div>
	  </div>
	  <div class="layui-form-item">
	    <label class="layui-form-label">班级</label>
	    <div class="layui-input-block">
	      <input type="text" id="clazz" name="clazz" placeholder="上机班级" autocomplete="off" class="layui-input">
	    </div>
	  </div>
	  <div class="layui-form-item">
	    <label class="layui-form-label">地点</label>
	    <div class="layui-input-block">
	      <input type="text" id="address" name="address" placeholder="上机地点" autocomplete="off" class="layui-input">
	    </div>
	  </div>
	</form>
		</script>
		<script type="text/html" id="eventBox3">
	<form class="layui-form" lay-filter="eventform3">
	  <div class="layui-form-item">
	    <label class="layui-form-label">教师</label>
	    <div class="layui-input-block">
	      <input type="text" id="teacher" name="teacher" placeholder="上机教师" autocomplete="off" class="layui-input">
	    </div>
	  </div>
	  <div class="layui-form-item">
	    <label class="layui-form-label">课程</label>
	    <div class="layui-input-block">
	      <input type="text" id="course" name="course" placeholder="上机课程" autocomplete="off" class="layui-input">
	    </div>
	  </div>
	  <div class="layui-form-item">
	    <label class="layui-form-label">模板</label>
	    <div class="layui-input-block">
	      <input type="text" id="template" name="template" placeholder="上机模板" autocomplete="off" class="layui-input">
	    </div>
	  </div>
	</form>
		</script>
		
	</body>
</html>
