<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>IP</title>
		<link rel="stylesheet" href="../layui/css/layui.css" />
		<link rel="stylesheet" href="../css/mb.css">
		<link rel="stylesheet" href="../css/iframe.css" />
		<script type="text/javascript" src="../js/global.js"></script>
	</head>
	<body>
		
		<blockquote class="my-block-quote">
		  <p class="my-big-title">IP管理</p>
		  一、管理员负责IP的创建与分配。
		</blockquote>
		<!-- 按钮 -->
		<div class="layui-btn-container">
		  <button type="button" class="layui-btn" data-method="add" data-type="auto">
		    <i class="layui-icon">&#xe608;</i> 创建IP段
		  </button>
		  <button type="button" class="layui-btn" data-method="dispatch" data-type="auto">
		    <i class="layui-icon">&#xe608;</i> IP分配
		  </button>
		</div>
		<hr class="layui-bg-green">
		<!-- 表格 -->
		<div class="layui-btn-container">
			<table class="layui-table" id="lay-table" lay-filter="tb-filter">
		</div>
		
		
		<script type="text/html" id="row-opBar">
		  <!-- <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="detail">查看</a> -->
		  <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
		  <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="edit">编辑</a>
		</script>
		<script type="text/html" id="layerform">
			<form id="tipsform" class="layui-form" lay-filter="tipsform">
				<input type="hidden" name="id" value=""/>
				<div class="layui-form-item">
					<label class="layui-form-label">起始IP</label>
					<div class="layui-input-block">
						<input type="text" name="startIP" required lay-verify="username"
							autocomplete="off" class="layui-input">
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">结束IP</label>
					<div class="layui-input-block">
						<input type="text" name="endIP" required lay-verify="username"
							autocomplete="off" class="layui-input" >
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">是否启用</label>
					<div class="layui-input-block">
						<select name="ipStatus" lay-verify="required">
        					<option value=""></option>
        					<option value="0">启用</option>
        					<option value="1">不启用</option>
      					</select>
					</div>
				</div>
				
				
			</form>
		</script>
		<script type="text/html" id="layerform2">
			<form id="tipsform" class="layui-form" lay-filter="tipsform">
				<input type="hidden" name="id" value=""/>
				<div class="layui-form-item">
					<label class="layui-form-label">IP段</label>
					<div class="layui-input-block">
						<select name="ipRange" lay-verify="required">
        					<option value="">请选择一个IP段</option>
      					</select>
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">分配给</label>
					<div class="layui-input-block">
						<select name="ipRange" lay-verify="required">
        					<option value="">请选择一个正在运行的虚拟机</option>
      					</select>
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">分配方式</label>
					<div class="layui-input-block">
						<input type="radio" name="method" value="DHCP" title="DHCP" lay-filter="dhcp" checked>
      					<input type="radio" name="method" value="MANAUAL" title="手动" lay-filter="manual">
					</div>
				</div>
				<div class="layui-form-item" style="display:none;" id="manual">
					<label class="layui-form-label">手动分配</label>
					<div class="layui-input-block">
						<input type="text" name="manualIP" required lay-verify="username"
							placeholder="请输入以上IP段的IP" autocomplete="off" class="layui-input">
					</div>
				</div>
				
			</form>
		</script>
	</body>
</html>
