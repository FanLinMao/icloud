<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>事件</title>
		<link rel="stylesheet" href="../layui/css/layui.css" />
		<link rel="stylesheet" href="../css/mb.css">
		<link rel="stylesheet" href="../css/iframe.css" />
		<script type="text/javascript" src="../js/global.js"></script>
	</head>
	<body>
		
		<blockquote class="my-block-quote">
		  <p class="my-big-title">事件</p>
		  一、事件、警报的管理主要将系统最近发生的事件列举出来，同时也将警报显示出来，提醒管理
员赶紧处理。
		</blockquote>
		<!-- 搜索栏 -->
		<div class="searchbox" style="width:98%;margin:0px auto;">
			开始时间：
			<div class="layui-inline">
				<input type="text" name="startDate" id="startDate" placeholder="yyyy-MM-dd" autocomplete="off" class="layui-input">
			</div>
			结束时间：
			<div class="layui-inline">
				<input type="text" name="endDate" id="endDate" placeholder="yyyy-MM-dd" autocomplete="off" class="layui-input">
			</div>
			<div class="layui-inline">
					<button type="button" class="layui-btn" id="search">搜 索</button>
			</div>
		</div>
				
		<hr class="layui-bg-green">
		<!-- 表格 -->
		<div class="layui-btn-container">
			<table class="layui-table" id="lay-table" lay-filter="tb-filter">
		</div>
		
		
		<script type="text/html" id="row-opBar">
		  <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
		  <!-- <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="edit">编辑</a> -->
		</script>
	</body>
</html>
