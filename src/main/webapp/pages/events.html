<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>事件</title>
		<link rel="stylesheet" href="../layui/css/layui.css" />
		<link rel="stylesheet" href="../css/mb.css">
		<link rel="stylesheet" href="../css/iframe.css" />
		<script type="text/javascript" src="../js/global.js"></script>
	</head>
	<body>
		
		<blockquote class="my-block-quote">
		  <p class="my-big-title">事件</p>
		  一、事件、警报的管理主要将系统最近发生的事件列举出来，同时也将警报显示出来，提醒管理
员赶紧处理。
		</blockquote>
		<!-- 搜索栏 -->
		<form class="layui-form" action="">
			<div class="layui-form-item">
				<div class="layui-inline">
				  <label class="layui-form-label">起始时间</label>
				  <div class="layui-input-inline">
					<input type="text" name="startDate" id="startDate" lay-verify="date" placeholder="yyyy-MM-dd" autocomplete="off" class="layui-input">
				  </div>
				</div>
				<div class="layui-inline">
				  <label class="layui-form-label">结束时间</label>
				  <div class="layui-input-inline">
					<input type="text" name="endDate" id="endDate" lay-verify="date" placeholder="yyyy-MM-dd" autocomplete="off" class="layui-input">
				  </div>
				</div>
				<div class="layui-inline">
				  <div class="layui-input-block">
						<button type="submit" class="layui-btn" lay-submit="" lay-filter="search">搜 索</button>
				  </div>
				</div>
				
			</div>
		</form>
		<hr class="layui-bg-green">
		<!-- 表格 -->
		<div class="layui-btn-container">
			<table class="layui-table" id="lay-table" lay-filter="tb-filter">
		</div>
		
		
		<script type="text/html" id="row-opBar">
		  <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="delete">删除</a>
		  <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="update">编辑</a>
		</script>
	</body>
</html>
