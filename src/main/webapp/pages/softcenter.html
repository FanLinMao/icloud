<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>软件中心</title>
		<link rel="stylesheet" href="../layui/css/layui.css" />
		<link rel="stylesheet" href="../css/mb.css">
		<link rel="stylesheet" href="../css/iframe.css" />
		<script type="text/javascript" src="../js/global.js"></script>
	</head>
	<body>
		<blockquote class="my-block-quote">
		  <p class="my-big-title">软件中心</p>
		  一、软件上传、删除等操作
		  
		  
		</blockquote>
		<!-- 按钮栏 -->
		<div class="layui-btn-container">
			<button type="button" class="layui-btn layui-btn-fluid" id="uploadSoft">上传软件</button> 
		</div>
		<div class="layui-progress layui-progress-big" lay-showPercent="yes" style="display:none;width:98%;margin:0px auto;" lay-filter="progressbar" id="progressbar">
		  <div class="layui-progress-bar layui-bg-red" lay-percent="0%"></div>
		</div>
		<!-- 表格 -->
		<div class="layui-btn-container">
			<table class="layui-table" id="lay-table" lay-filter="tb-filter">
		</div>
		
		
		<script type="text/html" id="row-opBar">
		  <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
		  <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="edit">编辑</a>
		</script>
		<script type="text/html" id="layerform">
			<form id="tipsform" class="layui-form" lay-filter="tipsform">
				<input type="hidden" name="softId" value=""/>
				<div class="layui-form-item">
					<label class="layui-form-label">名称</label>
					<div class="layui-input-block">
						<input type="text" name="softName" required lay-verify="username"
							placeholder="请输入名称" autocomplete="off" class="layui-input">
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">大小</label>
					<div class="layui-input-block">
						<input type="text" name="size" required lay-verify="username"
							autocomplete="off" class="layui-input" disabled>
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">上传者</label>
					<div class="layui-input-block">
						<input type="text" name="uploader" required lay-verify="username"
							autocomplete="off" class="layui-input" disabled>
					</div>
				</div>
				
				<div class="layui-form-item">
					<label class="layui-form-label">上传时间</label>
					<div class="layui-input-block">
						<input type="text" name="uploadDate" required lay-verify="username"
							autocomplete="off" class="layui-input" disabled>
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">备注</label>
					<div class="layui-input-block">
						<input type="text" name="mark" required lay-verify="username"
							autocomplete="off" class="layui-input">
					</div>
				</div>
				
			</form>
		</script>
	</body>
</html>
